name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, so new advisories surface without a push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", transport/grpcx, transport/wsx, data, otelx, natsx, natsx/integration, kafkax, kafkax/integration, sqsx, sqsx/integration, cmd/kakarot, examples/orders, examples/wallet, examples/checkout]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kk
          POSTGRES_PASSWORD: kk
          POSTGRES_DB: orders
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -p 1 ./...
        env:
          KAKAROT_TEST_DSN: postgres://kk:kk@localhost:5432/orders
      - name: layer rules and generated code
        if: startsWith(matrix.module, 'examples/')
        run: go tool kakarot check
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The broker modules' integration tests again, against a real Kafka broker
  # and LocalStack's SQS instead of the in-memory stand-ins.
  brokers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kafkax/integration, sqsx/integration]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      kafka:
        image: apache/kafka:4.1.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
      localstack:
        image: localstack/localstack:4.9
        env:
          SERVICES: sqs
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -fs localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race -count=1 -v ./...
        env:
          KAKAROT_TEST_KAFKA: localhost:9092
          KAKAROT_TEST_SQS: http://localhost:4566
