name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kk
          POSTGRES_PASSWORD: kk
          POSTGRES_DB: orders
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: example (live PostgreSQL)
        working-directory: examples/orders
        run: go vet ./... && go test -race -p 1 ./...
        env:
          KAKAROT_TEST_DSN: postgres://kk:kk@localhost:5432/orders
