name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, so new advisories surface without a push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", transport/grpcx, transport/wsx, data, otelx, cmd/kakarot, examples/orders, examples/wallet, examples/checkout]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kk
          POSTGRES_PASSWORD: kk
          POSTGRES_DB: orders
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -p 1 ./...
        env:
          KAKAROT_TEST_DSN: postgres://kk:kk@localhost:5432/orders
      - name: layer rules and generated code
        if: startsWith(matrix.module, 'examples/')
        run: go tool kakarot check
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
